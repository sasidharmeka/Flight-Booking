name: Flight Booking CICD

on:
  push:
    branches:
      - dev
      - main
  workflow_dispatch:

jobs:
  Bucket-Airflow-Deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Upload DAG to bucket prefix
        env:
          # EITHER set this to "gs://your-bucket/dags" OR to just "your-bucket"
          AIRFLOW_BUCKET_URL: ${{ vars.AIRFLOW_BUCKET_NAME }}
          DEFAULT_PREFIX: dags
          LOCAL_DAG_PATH: airflow_job/airflow_job.py
        run: |
          set -euo pipefail

          raw="$AIRFLOW_BUCKET_URL"

          # If it starts with gs://, strip it and split into bucket + optional prefix
          if [[ "$raw" == gs://* ]]; then
            tmp="${raw#gs://}"               # strip scheme
            BUCKET="${tmp%%/*}"              # before first slash
            rest="${tmp#*/}"                 # after first slash
            [[ "$rest" == "$tmp" ]] && PREFIX="" || PREFIX="$rest"
          else
            # treat value as bare bucket name; default prefix = dags/
            BUCKET="$raw"
            PREFIX="$DEFAULT_PREFIX"
          fi

          # Basic validation
          if [[ -z "$BUCKET" || "$BUCKET" == */* ]]; then
            echo "ERROR: Invalid bucket spec. Provide 'gs://bucket[/prefix]' or just 'bucket'."
            exit 1
          fi

          # Ensure bucket exists
          if ! gsutil ls -b "gs://$BUCKET" >/dev/null 2>&1; then
            echo "ERROR: Bucket gs://$BUCKET does not exist."
            exit 1
          fi

          # Build destination (prefix may be empty)
          if [[ -n "${PREFIX:-}" ]]; then
            # normalize to end with a trailing slash
            DEST="gs://$BUCKET/${PREFIX%/}/"
          else
            DEST="gs://$BUCKET/"
          fi

          echo "Uploading $LOCAL_DAG_PATH -> $DEST"
          gsutil cp "$LOCAL_DAG_PATH" "$DEST"

  Bucket-Create-And-Seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Authenticate to GCP with your SA key JSON secret
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # Install gcloud/gsutil
      - uses: google-github-actions/setup-gcloud@v2

      - name: Create bucket (if needed) and folders
        env:
          BUCKET_NAME: ${{ vars.BUCKET_NAME }}   # e.g. my-unique-bucket-name (NO gs://, NO slashes)
          LOCATION: us-central1                  # change if needed
        run: |
          set -euo pipefail

          # Validate bucket name (must not include path segments)
          if [[ "$BUCKET_NAME" == *"/"* ]]; then
            echo "ERROR: BUCKET_NAME must be a bare name (no slashes). Given: '$BUCKET_NAME'"
            exit 1
          fi

          # Create the bucket if it doesn't exist (idempotent)
          if ! gsutil ls -b "gs://$BUCKET_NAME" >/dev/null 2>&1; then
            echo "Creating bucket gs://$BUCKET_NAME in $LOCATION"
            gsutil mb -l "$LOCATION" "gs://$BUCKET_NAME"
            # Optional hardening:
            gsutil uniformbucketlevelaccess set on "gs://$BUCKET_NAME"
            gsutil pap set enforced "gs://$BUCKET_NAME"   # public access prevention
          else
            echo "Bucket gs://$BUCKET_NAME already exists"
          fi

          # Create 5 top-level folders (prefixes), skip if they already exist
          FOLDERS=("data" "output" "source-dev" "source-prod" "spark-job")
          for dir in "${FOLDERS[@]}"; do
            if ! gsutil ls -d "gs://$BUCKET_NAME/$dir/" >/dev/null 2>&1; then
              echo "Creating folder gs://$BUCKET_NAME/$dir/"
              gsutil mkdir "gs://$BUCKET_NAME/$dir"
            else
              echo "Folder gs://$BUCKET_NAME/$dir/ already exists"
            fi
          done
  upload-to-dev:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest

    steps:
      # Checkout the repository
      - name: Checkout Code
        uses: actions/checkout@v3

      # Authenticate to GCP
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # Setup Google Cloud SDK
      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v1
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      # Upload `variables.json` to Composer bucket
      - name: Upload Variables JSON to GCS
        run: |
          gsutil cp variables/dev/variables.json gs://us-central1-airflow-flight--866ea176-bucket/data/dev/variables.json

      # Import Variables into Airflow-DEV
      - name: Import Variables into Airflow-DEV
        run: |
          gcloud composer environments run airflow-dev \
            --location us-central1 \
            variables import -- /home/airflow/gcs/data/dev/variables.json

      # Sync Spark job to GCS
      - name: Upload Spark Job to GCS
        run: |
          gsutil cp spark_job/spark_transformation_job.py gs://airflow-flight-proj/spark-job/

      # Sync Airflow DAG to Airflow DEV Composer
      - name: Upload Airflow DAG to DEV
        run: |
          gcloud composer environments storage dags import \
            --environment airflow-dev \
            --location us-central1 \
            --source airflow_job/airflow_job.py

  upload-to-prod:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      # Checkout the repository
      - name: Checkout Code
        uses: actions/checkout@v3

      # Authenticate to GCP
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # Setup Google Cloud SDK
      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v1
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      # Upload `variables.json` to Composer bucket
      - name: Upload Variables JSON to GCS
        run: |
          gsutil cp variables/prod/variables.json gs://us-central1-airflow-flight--866ea176-bucket/data/prod/variables.json

      # Import Variables into Airflow-PROD
      - name: Import Variables into Airflow-PROD
        run: |
          gcloud composer environments run airflow-prod \
            --location us-central1 \
            variables import -- /home/airflow/gcs/data/prod/variables.json

      # Sync Spark job to GCS
      - name: Upload Spark Job to GCS
        run: |
          gsutil cp spark_job/spark_transformation_job.py gs://airflow-flight-proj/spark-job/

      # Sync Airflow DAG to Airflow PROD Composer
      - name: Upload Airflow DAG to PROD
        run: |
          gcloud composer environments storage dags import \
            --environment airflow-prod \
            --location us-central1 \
            --source airflow_job/airflow_job.py